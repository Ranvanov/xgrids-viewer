<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGRIDS LCC 3D Viewer</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        #canvas-container { 
            width: 100%; 
            height: 100%; 
        }
        #loading {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: #fff; 
            font-family: sans-serif; 
            font-size: 18px; 
            pointer-events: none;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./lcc-0.6.0.umd.js"></script>
</head>
<body>

    <div id="loading">Загрузка 3D-модели XGRIDS...</div>
    <div id="canvas-container"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const loadingEl = document.getElementById('loading');

            // 1. Создаем сцену Three.js
            const scene = new THREE.Scene();
            
            // 2. Настраиваем камеру
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // 3. Создаем стандартный рендерер
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Инициализируем рендерер XGRIDS, используя точное имя LCCRender
            // Передаем ему наши настройки: renderer, scene и camera
            const lccRenderer = new LCC.LCCRender(renderer, scene, camera);

            // 5. Указываем путь к переименованному файлу модели
            const modelUrl = './models/scene.txt'; 

            // Запускаем загрузку
            lccRenderer.load(modelUrl).then(() => {
                // Как только модель прочитана, убираем надпись загрузки
                loadingEl.style.display = 'none';
                console.log("Модель XGRIDS успешно загружена!");
                
                // Запускаем бесконечный цикл отрисовки
                animate();
            }).catch(err => {
                loadingEl.innerText = "Ошибка загрузки файла модели. Проверьте размер файла в папке models.";
                console.error("Ошибка загрузки:", err);
            });

            // Цикл отрисовки кадров
            function animate() {
                requestAnimationFrame(animate);
                
                // Просим движок XGRIDS обновить кадр (стриминг точек)
                if (lccRenderer && typeof lccRenderer.update === 'function') {
                    lccRenderer.update();
                }
                
                renderer.render(scene, camera);
            }

            // Корректировка при изменении размеров экрана (например, на смартфонах)
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
