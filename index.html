<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGRIDS LCC 3D Viewer</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        #canvas-container { 
            width: 100%; 
            height: 100%; 
        }
        #loading {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: #fff; 
            font-family: sans-serif; 
            font-size: 18px; 
            pointer-events: none;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./lcc-0.6.0.umd.js"></script>
</head>
<body>

    <div id="loading">Загрузка 3D-сцены XGRIDS...</div>
    <div id="canvas-container"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const loadingEl = document.getElementById('loading');

            // 1. Создаем стандартную сцену Three.js
            const scene = new THREE.Scene();
            
            // 2. Настраиваем камеру
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // 3. Создаем рендерер Three.js
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Проверяем наличие библиотеки XGRIDS (LCC)

                loadingEl.innerText = "Ошибка: Библиотека LCC не загрузилась. Проверьте, лежит ли файл lcc-0.6.0.umd.js в корне репозитория.";
                return;
            }

            let lccRenderer;
            
            // Автоматически подбираем правильное имя конструктора из SDK XGRIDS
            if (typeof LCC.LCCRenderer === 'function') {
                lccRenderer = new LCC.LCCRenderer(renderer, scene, camera);
            } else if (typeof LCC.Renderer === 'function') {
