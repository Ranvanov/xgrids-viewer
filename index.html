<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGRIDS LCC 3D Viewer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-family: sans-serif; font-size: 18px; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./lcc-0.6.0.umd.js"></script>
</head>
<body>

    <div id="loading">Загрузка 3D-сцены XGRIDS...</div>
    <div id="canvas-container"></div>

    <script>
        // Ждем, пока загрузится вся страница и библиотеки
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const loadingEl = document.getElementById('loading');

            // 1. Создаем стандартную сцену Three.js
            const scene = new THREE.Scene();
            
            // 2. Настраиваем камеру
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // 3. Создаем рендерер
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Инициализируем рендерер XGRIDS LCC
            // В версии 0.6.0.umd объект библиотеки обычно доступен в глобальной переменной LCC
            if (typeof LCC === 'undefined') {
                loadingEl.innerText = "Ошибка: Библиотека LCC не загрузилась. Проверьте имя файла SDK.";
                return;
            }

            // Создаем экземпляр LCC Рендерера
            const lccRenderer = new LCC.LCCRenderer(renderer, scene, camera);

            // 5. Загружаем вашу модель из папки models
            // Замените 'scene.lcc' на точное имя вашего файла, если оно другое (например, с расширением .lcc или .ply)
            const modelUrl = './models/scene.lcc'; 

            lccRenderer.load(modelUrl).then(() => {
                // Скрываем надпись загрузки, когда модель отобразилась
                loadingEl.style.display = 'none';
                console.log("Модель XGRIDS успешно загружена!");
                
                // Запускаем цикл отрисовки
                animate();
            }).catch(err => {
                loadingEl.innerText = "Ошибка при загрузке файла модели.";
                console.error("Ошибка LCC:", err);
            });

            // Цикл анимации
            function animate() {
                requestAnimationFrame(animate);
                
                // Обязательное обновление состояния XGRIDS (для динамической подгрузки деталей)
                if (lccRenderer && lccRenderer.update) {
                    lccRenderer.update();
                }
                
                renderer.render(scene, camera);
            }

            // Следим за изменением размеров окна браузера
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
