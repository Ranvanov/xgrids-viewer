<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>XGRIDS SDK Debugger</title>
    <style>
        body { background-color: #111; color: #00ff00; font-family: monospace; padding: 20px; font-size: 16px; line-height: 1.5; }
        h1 { color: #fff; font-size: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./lcc-0.6.0.umd.js"></script>
</head>
<body>

    <h1>Результат анализа библиотеки XGRIDS SDK:</h1>
    <div id="debug-output">Проверяю объект LCC...</div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const output = document.getElementById('debug-output');
            
            if (typeof LCC === 'undefined') {
                output.innerHTML = "❌ Ошибка: Глобальный объект 'LCC' не найден в системе.<br>Возможно, библиотека использует другое имя. Проверяем окно браузера...<br>";
                
                // Ищем похожие названия в памяти браузера
                const keys = Object.keys(window).filter(k => k.toLowerCase().includes('lcc') || k.toLowerCase().includes('grid'));
                output.innerHTML += "Найденные похожие объекты в window: " + JSON.stringify(keys);
                return;
            }

            output.innerHTML = "✅ Объект 'LCC' успешно найден!<br><br>";
            output.innerHTML += "<b>Тип объекта:</b> " + typeof LCC + "<br><br>";
            
            // Выводим все внутренние функции библиотеки XGRIDS
            try {
                const methods = Object.keys(LCC);
                if (methods.length === 0) {
                    output.innerHTML += "⚠️ Объект LCC пустой. Возможно, это функция. Пробуем строку: " + LCC.toString().substring(0, 200);
                } else {
                    output.innerHTML += "<b>Доступные команды внутри LCC (содержимое):</b><br>[ " + methods.join(', ') + " ]";
                }
            } catch(e) {
                output.innerHTML += "Ошибка при чтении структуры: " + e.message;
            }
        });
    </script>
</body>
</html>
